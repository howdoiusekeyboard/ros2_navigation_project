name: 🔍 Backup & Repository Validation

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [ master, main ]
    paths:
      - '.gitignore'
      - '.gitattributes'
      - 'RECOVERY.md'
      - 'BACKUP_GUIDE.md'
      - 'DEPENDENCIES.md'

jobs:
  validate-repository:
    name: Validate Repository Health
    runs-on: ubuntu-22.04
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Pull Git LFS files
          
      - name: 🔍 Check Critical Files Present
        run: |
          echo "Checking for critical recovery files..."
          MISSING_FILES=()
          
          # Core documentation
          [ ! -f "README.md" ] && MISSING_FILES+=("README.md")
          [ ! -f "RECOVERY.md" ] && MISSING_FILES+=("RECOVERY.md")
          [ ! -f "BACKUP_GUIDE.md" ] && MISSING_FILES+=("BACKUP_GUIDE.md")
          [ ! -f "DEPENDENCIES.md" ] && MISSING_FILES+=("DEPENDENCIES.md")
          [ ! -f "CLAUDE.md" ] && MISSING_FILES+=("CLAUDE.md")
          
          # Configuration files
          [ ! -f ".gitignore" ] && MISSING_FILES+=(".gitignore")
          [ ! -f ".gitattributes" ] && MISSING_FILES+=(".gitattributes")
          
          # ROS2 packages
          [ ! -d "src/cartographer_slam" ] && MISSING_FILES+=("src/cartographer_slam")
          [ ! -d "src/map_server" ] && MISSING_FILES+=("src/map_server")
          [ ! -d "src/localization_server" ] && MISSING_FILES+=("src/localization_server")
          [ ! -d "src/path_planner_server" ] && MISSING_FILES+=("src/path_planner_server")
          
          # Backend
          [ ! -f "backend/requirements.txt" ] && MISSING_FILES+=("backend/requirements.txt")
          [ ! -f "backend/app/main.py" ] && MISSING_FILES+=("backend/app/main.py")
          
          # Frontend
          [ ! -f "project/package.json" ] && MISSING_FILES+=("project/package.json")
          [ ! -f "project/src/App.tsx" ] && MISSING_FILES+=("project/src/App.tsx")
          
          # Scripts
          [ ! -f "scripts/backup.sh" ] && MISSING_FILES+=("scripts/backup.sh")
          [ ! -f "scripts/verify-backup.sh" ] && MISSING_FILES+=("scripts/verify-backup.sh")
          
          if [ ${#MISSING_FILES[@]} -eq 0 ]; then
            echo "✅ All critical files present"
          else
            echo "❌ Missing critical files:"
            printf '%s\n' "${MISSING_FILES[@]}"
            exit 1
          fi

      - name: 📋 Validate .gitignore Completeness
        run: |
          echo "Validating .gitignore patterns..."
          
          # Check for essential exclusions
          REQUIRED_PATTERNS=(
            "build/"
            "install/"
            "log/"
            "node_modules/"
            "__pycache__/"
            "*.pyc"
            ".env"
            "venv/"
            "*.db"
            "*.log"
          )
          
          MISSING_PATTERNS=()
          for PATTERN in "${REQUIRED_PATTERNS[@]}"; do
            if ! grep -q "$PATTERN" .gitignore; then
              MISSING_PATTERNS+=("$PATTERN")
            fi
          done
          
          if [ ${#MISSING_PATTERNS[@]} -eq 0 ]; then
            echo "✅ .gitignore includes all essential patterns"
          else
            echo "⚠️  .gitignore missing patterns:"
            printf '%s\n' "${MISSING_PATTERNS[@]}"
            echo "Consider adding these to .gitignore"
          fi

      - name: 🔐 Verify Git-Crypt Configuration
        run: |
          echo "Checking git-crypt configuration..."
          
          if [ -f ".gitattributes" ]; then
            if grep -q "filter=git-crypt" .gitattributes; then
              echo "✅ git-crypt configured in .gitattributes"
              
              # Check for .env file patterns
              if grep -q "\.env.*filter=git-crypt" .gitattributes; then
                echo "✅ .env files set to be encrypted"
              else
                echo "⚠️  .env files may not be encrypted"
              fi
            else
              echo "⚠️  git-crypt not configured"
            fi
          else
            echo "❌ .gitattributes file missing"
            exit 1
          fi

      - name: 📦 Verify Git LFS Configuration
        run: |
          echo "Checking Git LFS configuration..."
          
          if [ -f ".gitattributes" ]; then
            if grep -q "filter=lfs" .gitattributes; then
              echo "✅ Git LFS configured in .gitattributes"
              
              # Check for large file patterns
              if grep -q "\.pdf.*filter=lfs" .gitattributes; then
                echo "✅ PDF files tracked by LFS"
              fi
              if grep -q "\.pgm.*filter=lfs" .gitattributes; then
                echo "✅ Map files tracked by LFS"
              fi
            else
              echo "⚠️  Git LFS not configured"
            fi
          fi
          
          # Verify LFS files are actually in LFS
          if git lfs ls-files | grep -q "\.pdf"; then
            echo "✅ PDF files stored in LFS"
          else
            echo "⚠️  PDF files may not be in LFS"
          fi

      - name: 🐍 Validate Python Dependencies
        run: |
          echo "Checking Python requirements file..."
          
          if [ -f "backend/requirements.txt" ]; then
            REQUIRED_PACKAGES=(
              "fastapi"
              "openai"
              "google-generativeai"
            )
            
            MISSING_PACKAGES=()
            for PACKAGE in "${REQUIRED_PACKAGES[@]}"; do
              if ! grep -q "$PACKAGE" backend/requirements.txt; then
                MISSING_PACKAGES+=("$PACKAGE")
              fi
            done
            
            if [ ${#MISSING_PACKAGES[@]} -eq 0 ]; then
              echo "✅ All required Python packages listed"
            else
              echo "⚠️  Missing Python packages:"
              printf '%s\n' "${MISSING_PACKAGES[@]}"
            fi
          else
            echo "❌ backend/requirements.txt not found"
            exit 1
          fi

      - name: 📦 Validate Node.js Dependencies
        run: |
          echo "Checking package.json..."
          
          if [ -f "project/package.json" ]; then
            # Check for required packages
            REQUIRED_PACKAGES=(
              "react"
              "roslib"
              "@google/generative-ai"
            )
            
            for PACKAGE in "${REQUIRED_PACKAGES[@]}"; do
              if grep -q "\"$PACKAGE\"" project/package.json; then
                echo "✅ Found: $PACKAGE"
              else
                echo "⚠️  Missing: $PACKAGE"
              fi
            done
            
            # Check for Bun lock file (standardized)
            if [ -f "project/bun.lock" ]; then
              echo "✅ Bun lock file present"
            fi
            
            # Warn if npm lock file exists (should be removed)
            if [ -f "project/package-lock.json" ]; then
              echo "⚠️  package-lock.json still exists (should use bun.lock)"
            fi
          else
            echo "❌ project/package.json not found"
            exit 1
          fi

      - name: 🤖 Validate ROS2 Package Structure
        run: |
          echo "Validating ROS2 packages..."
          
          ROS2_PACKAGES=(
            "cartographer_slam"
            "map_server"
            "localization_server"
            "path_planner_server"
          )
          
          for PKG in "${ROS2_PACKAGES[@]}"; do
            PKG_DIR="src/$PKG"
            
            if [ -d "$PKG_DIR" ]; then
              # Check for required files
              if [ -f "$PKG_DIR/package.xml" ] && [ -f "$PKG_DIR/setup.py" ]; then
                echo "✅ $PKG - structure valid"
              else
                echo "❌ $PKG - missing required files"
                exit 1
              fi
            else
              echo "❌ $PKG - directory not found"
              exit 1
            fi
          done

      - name: 📝 Validate Documentation Links
        run: |
          echo "Checking documentation cross-references..."
          
          # Check if README links to recovery docs
          if grep -q "RECOVERY.md" README.md; then
            echo "✅ README links to RECOVERY.md"
          else
            echo "⚠️  README should link to RECOVERY.md"
          fi
          
          if grep -q "BACKUP_GUIDE.md" README.md; then
            echo "✅ README links to BACKUP_GUIDE.md"
          else
            echo "⚠️  README should link to BACKUP_GUIDE.md"
          fi
          
          if grep -q "DEPENDENCIES.md" README.md; then
            echo "✅ README links to DEPENDENCIES.md"
          else
            echo "⚠️  README should link to DEPENDENCIES.md"
          fi

      - name: 🔒 Security Check - No Exposed Secrets
        run: |
          echo "Checking for accidentally committed secrets..."
          
          # Check for common secret patterns (should NOT find any)
          FOUND_SECRETS=false
          
          # Check for API keys in plain text (not in .example files)
          if grep -r "sk-[a-zA-Z0-9]\{32,\}" --exclude="*.example" --exclude="*.md" . 2>/dev/null; then
            echo "❌ Found potential OpenAI API key in repository!"
            FOUND_SECRETS=true
          fi
          
          if grep -r "AIza[a-zA-Z0-9_-]\{35,\}" --exclude="*.example" --exclude="*.md" . 2>/dev/null; then
            echo "❌ Found potential Google API key in repository!"
            FOUND_SECRETS=true
          fi
          
          # Check if .env files are tracked (should NOT be, except .env.example)
          if git ls-files | grep -E "\.env$|\.env\.local$" | grep -v "\.env\.example"; then
            echo "❌ .env files are being tracked by git!"
            echo "These should be encrypted with git-crypt or in .gitignore"
            FOUND_SECRETS=true
          fi
          
          if [ "$FOUND_SECRETS" = true ]; then
            echo ""
            echo "🚨 SECURITY ISSUE: Secrets may be exposed!"
            echo "Action required:"
            echo "  1. Remove secrets from git history"
            echo "  2. Rotate exposed API keys"
            echo "  3. Use git-crypt for .env files"
            exit 1
          else
            echo "✅ No exposed secrets detected"
          fi

      - name: 📊 Repository Health Summary
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "            Repository Health Report"
          echo "============================================================"
          echo ""
          echo "Date: $(date)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "All validation checks completed."
          echo "Review output above for any warnings or failures."
          echo ""
          echo "For disaster recovery procedures, see:"
          echo "  - RECOVERY.md"
          echo "  - BACKUP_GUIDE.md"
          echo ""
          echo "============================================================"

      - name: 💬 Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Repository validation passed! All backup infrastructure is intact.'
            })

