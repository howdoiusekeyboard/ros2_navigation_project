# XAI Navigator Configuration
# Week 3: Decision Logging & Data Capture
# Week 4+: Weighted Obstacle Classification (Tesla-style)

xai_navigator_node:
  ros__parameters:
    # === Logging Configuration ===
    enable_logging: true
    explanation_level: "detailed"  # Options: simple, detailed, debug

    # === Explanation Settings ===
    enable_explanations: true
    gemini_api_key: ""  # Set via launch file or env var
    explanation_cache_enabled: true
    auto_explain_decisions: true
    explanation_max_latency: 2.0  # seconds

    # === Backend Sync ===
    backend_url: "http://localhost:8000"
    sync_interval: 5.0  # seconds between sync attempts
    sync_batch_size: 50  # max decisions per sync

    # === Obstacle Detection ===
    critical_distance: 0.3   # meters - immediate action needed
    warning_distance: 1.0    # meters - caution required

    # === Path Analysis ===
    deviation_threshold: 0.3  # meters - minimum change to report

    # === Performance ===
    costmap_check_interval: 0.5  # seconds (2Hz obstacle checking)
    feedback_throttle: 0.2  # seconds (5Hz max feedback rate)

    # === Simulation ===
    use_sim_time: true

    # === NEW: Weighted Obstacle Classification (Week 4+) ===
    enable_obstacle_weighting: true
    semantic_zones_config: "semantic_zones.yaml"  # relative to config/

    # Priority weights (Tesla-style: humans >> objects)
    # Higher weight = more urgent to avoid
    obstacle_weights:
      human: 10.0      # Highest priority - always protect
      vehicle: 5.0     # High priority - potential danger
      dynamic: 3.0     # Moving but unknown type
      furniture: 2.0   # Static, can navigate around
      wall: 1.0        # Permanent structure
      unknown: 1.5     # Default cautious weight

    # Classification thresholds
    classification:
      # Velocity thresholds (m/s)
      vehicle_velocity_threshold: 1.5   # > this = likely vehicle
      human_velocity_min: 0.3           # Walking speed lower bound
      human_velocity_max: 1.5           # Walking speed upper bound

      # Size thresholds (meters)
      human_size_max: 0.6               # Typical human width
      furniture_size_min: 0.8           # Larger than human

      # Confidence threshold for classification
      min_confidence: 0.3               # Below this = 'unknown'

